name: Verify

# Full verification of the storefront:
#   1. builds every project and reports all compiler errors as a commit comment,
#   2. (optional) generates an EF Core migration when .github/ef-migration-request exists,
#   3. boots the web app against a real SQL Server and smoke-tests every public page.

on:
  push:
    branches:
      - dev
      - master
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.build.outputs.ok }}
      migration: ${{ steps.flags.outputs.migration }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect migration request
        id: flags
        run: |
          if [ -f .github/ef-migration-request ]; then echo "migration=true" >> "$GITHUB_OUTPUT"; else echo "migration=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Fratak-Shop.slnx

      - name: Build
        id: build
        run: |
          set +e
          dotnet build Fratak-Shop.slnx --no-restore -c Release -v minimal -clp:NoSummary > build.log 2>&1
          code=$?
          grep -E ": error " build.log | sed -E "s#^ *${GITHUB_WORKSPACE}/##; s# \[[^]]*\]\$##" | sort -u > errors.txt
          echo "Build exit code: $code ($(wc -l < errors.txt) unique errors)"
          if [ $code -eq 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Report errors
        if: steps.build.outputs.ok != 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "### Build failed"; echo '```'; head -c 60000 errors.txt; echo '```'; } > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null
          head -n 40 errors.txt | while read -r line; do echo "::error::$line"; done
          exit 1

  migration:
    name: Generate EF migration
    needs: build
    if: needs.build.outputs.ok == 'true' && github.event_name == 'push' && needs.build.outputs.migration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Generate migration and commit it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(head -n 1 .github/ef-migration-request | tr -d '[:space:]')
          dotnet restore Fratak-Shop.slnx
          dotnet tool install --global dotnet-ef --version 10.0.13
          if ! dotnet ef migrations add "$name" --project src/Fratak-Shop.Data --startup-project src/Fratak-Shop.Data --output-dir Migrations > ef.log 2>&1; then
            { echo "### EF migration failed"; echo '```'; tail -c 30000 ef.log; echo '```'; } > body.md
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null
            exit 1
          fi
          git rm -q .github/ef-migration-request
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Fratak-Shop.Data/Migrations
          git commit -m "Add EF Core migration: $name"
          git push origin HEAD:${{ github.ref_name }}

  smoke:
    name: Smoke test (SQL Server)
    needs: build
    if: needs.build.outputs.ok == 'true' && needs.build.outputs.migration != 'true'
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Smoke_Test_Passw0rd!"
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish web app
        run: dotnet publish src/Fratak-Shop.Web/Fratak-Shop.Web.csproj -c Release -o out -p:FratakPublishTarget=linux

      # Round 17: the publish output only carries the target OS native files and never local data.
      - name: Check publish output (size and contents)
        run: |
          set -euo pipefail
          dotnet publish src/Fratak-Shop.Web/Fratak-Shop.Web.csproj -c Release -o out-win -p:FratakPublishTarget=windows --no-restore > publish-win.log 2>&1 || { cat publish-win.log; exit 1; }
          check() {
            dir="$1"; shift
            for bad in "$@"; do
              if [ -e "$dir/$bad" ]; then echo "::error::$dir must not contain $bad"; exit 1; fi
            done
          }
          check out runtimes/win-x64 runtimes/win-arm64 runtimes/osx-arm64 runtimes/linux-arm64 App_Data appsettings.Development.json wwwroot/uploads
          check out-win runtimes/linux-x64 runtimes/linux-arm64 runtimes/osx-arm64 runtimes/win-arm64 runtimes/unix App_Data appsettings.Development.json wwwroot/uploads
          ls out/runtimes || true
          ls out-win/runtimes || true
          test -n "$(find out-win/runtimes/win-x64 -iname 'libSkiaSharp.dll' | head -1)" || { echo "::error::windows publish lacks libSkiaSharp.dll"; exit 1; }
          test -n "$(find out-win/runtimes/win-x64 -iname 'onnxruntime.dll' | head -1)" || { echo "::error::windows publish lacks onnxruntime.dll"; exit 1; }
          test -n "$(find out/runtimes -iname 'libSkiaSharp.so' | head -1)" || { echo "::error::linux publish lacks libSkiaSharp.so"; exit 1; }
          linux_mb=$(du -sm out | cut -f1)
          win_mb=$(du -sm out-win | cut -f1)
          echo "::notice::Publish size: linux ${linux_mb} MB, windows ${win_mb} MB"
          if [ "$win_mb" -gt 140 ] || [ "$linux_mb" -gt 140 ]; then echo "::error::publish output is larger than 140 MB"; exit 1; fi
          rm -rf out-win

      - name: Run app and request pages
        env:
          ConnectionDefault: "Server=localhost,1433;Database=FratakShopSmoke;User Id=sa;Password=Smoke_Test_Passw0rd!;TrustServerCertificate=True;MultipleActiveResultSets=true"
          Shop__SeedDemoData: "true"
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: "http://localhost:5080"
        run: |
          cd out
          nohup dotnet Fratak-Shop.Web.dll > ../app.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -s -o /dev/null http://localhost:5080/; then break; fi
            sleep 2
          done
          cd ..
          set +e
          bash .github/scripts/smoke-test.sh http://localhost:5080 > smoke.txt 2>&1
          status=$?
          cat smoke.txt
          grep "^FAIL" smoke.txt | head -20 | while read -r line; do echo "::error::$line"; done
          exit $status

      - name: Report smoke results
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Smoke test"
            echo '```'; cat smoke.txt 2>/dev/null | head -c 30000; echo '```'
            echo "#### App log (errors)"
            echo '```'; grep -E -A12 "fail:|Unhandled|Exception" app.log 2>/dev/null | head -c 25000; echo '```'
          } > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null

  tests:
    name: Tests (unit + SQL Server integration)
    needs: build
    if: needs.build.outputs.ok == 'true' && needs.build.outputs.migration != 'true'
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Tests_Passw0rd!"
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        id: test
        env:
          # Each integration test class creates (and drops) its own database on this server.
          FRATAK_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=Tests_Passw0rd!;TrustServerCertificate=True;MultipleActiveResultSets=true"
        run: |
          set +e
          dotnet test tests/Fratak-Shop.Tests/Fratak-Shop.Tests.csproj -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[Fratak-Shop.*]*" DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile="**/Migrations/*.cs" > test.log 2>&1
          code=$?
          tail -n 40 test.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for path in glob.glob("TestResults/*.trx"):
              c = ET.parse(path).getroot().find("t:ResultSummary/t:Counters", ns)
              if c is not None:
                  print(f"::notice title=Tests::{c.get('passed')} of {c.get('total')} passed, {c.get('failed')} failed, {c.get('notExecuted')} skipped")
          PY

      - name: Tests per section and code coverage
        if: always()
        run: |
          python3 - <<'PY'
          import glob, collections, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          sections = collections.Counter(); failed = collections.Counter()
          for path in glob.glob("TestResults/*.trx"):
              root = ET.parse(path).getroot()
              outcome = {r.get("testId"): r.get("outcome") for r in root.iter("{%s}UnitTestResult" % ns["t"])}
              for test in root.iter("{%s}UnitTest" % ns["t"]):
                  method = test.find("t:TestMethod", ns)
                  parts = (method.get("className") if method is not None else "").split(".")
                  # Fratak_Shop.Tests.<Unit|Integration|E2E>[.<Area>].<Class>
                  key = (parts[2] + ("." + parts[3] if len(parts) > 4 else "")) if len(parts) > 3 else "?"
                  sections[key] += 1
                  if outcome.get(test.get("id")) == "Failed":
                      failed[key] += 1
          lines = ["| Section | Tests | Failed |", "|---|---:|---:|"] + [f"| {k} | {v} | {failed[k]} |" for k, v in sorted(sections.items())]
          rates = []
          for path in glob.glob("TestResults/**/coverage.cobertura.xml", recursive=True):
              root = ET.parse(path).getroot()
              rates.append(f"Line coverage {float(root.get('line-rate', 0)) * 100:.1f}% · branch coverage {float(root.get('branch-rate', 0)) * 100:.1f}%")
              for package in root.iter("package"):
                  rates.append(f"- {package.get('name')}: {float(package.get('line-rate', 0)) * 100:.1f}% lines")
          with open("summary.md", "w") as f:
              f.write("## Tests per section\n\n" + "\n".join(lines) + "\n\n## Coverage\n\n" + ("\n".join(rates) or "no coverage file") + "\n")
          print(open("summary.md").read())
          PY
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Vulnerable NuGet packages
        if: always()
        run: |
          dotnet list Fratak-Shop.slnx package --vulnerable --include-transitive > vulnerable.txt 2>&1 || true
          cat vulnerable.txt
          if grep -qE "^\s+>\s" vulnerable.txt; then
            echo "::warning title=Vulnerable packages::$(grep -E '^\s+>\s' vulnerable.txt | tr -s ' ' | head -c 900)"
            { echo "## Vulnerable packages"; echo '```'; cat vulnerable.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=Vulnerable packages::none found"
          fi

      - name: Upload test summary and coverage
        if: always()
        # سهمیهٔ فضای Artifact ممکن است پر باشد؛ نبودِ آپلود نباید گزارش خطای آزمون‌ها را پنهان کند.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: |
            summary.md
            vulnerable.txt
            TestResults/**/coverage.cobertura.xml
          retention-days: 7

      - name: Report test results
        if: always() && steps.test.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            python3 .github/scripts/trx-failures.py TestResults/*.trx 2>/dev/null || echo "### Tests failed (no trx)"
            echo "#### Log tail"
            echo '```'; grep -E "error|Error|Failed|failed" test.log | tail -n 40 | head -c 15000; echo '```'
          } > body.md
          cat body.md
          if [ "${{ github.event_name }}" = "push" ]; then gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null; fi
          exit 1
