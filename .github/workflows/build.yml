name: Build

on:
  push:
    branches: ["arena/01a101d3-fratak-shop"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Fratak-Shop.slnx
      - name: Build
        run: dotnet build Fratak-Shop.slnx --no-restore --configuration Release
