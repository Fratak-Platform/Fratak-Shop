name: Build

on:
  push:
    branches: [arena/01a0e73c-fratak-shop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Fratak-Shop.slnx -c Release
      - name: Validate EF model
        run: dotnet run --project tools/ModelCheck/ModelCheck.csproj -c Release
