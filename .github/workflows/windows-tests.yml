name: Windows tests

# همهٔ آزمون‌ها روی ویندوزی شبیه سیستم برنامه‌نویس: زبان و قالب فارسی (fa-IR)، منطقهٔ زمانی تهران،
# پایان خط CRLF و SQL Server LocalDB — بدون متغیر FRATAK_TEST_SQL، تا پیدا کردن خودکار سرور (TestSql) هم آزموده شود.
# اگر حتی یک آزمون رد (Skipped) شود یعنی سرور پیدا نشده و این کار شکست می‌خورد.

on:
  push:
    branches:
      - dev
      - master
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # متن فارسی پیام‌های خطا در کنسول ویندوز (cp1252) پایتون را از کار می‌انداخت.
  PYTHONIOENCODING: utf-8

jobs:
  tests:
    name: Tests (Windows, fa-IR, LocalDB)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Persian Windows settings (culture fa-IR, Tehran time zone)
        shell: pwsh
        run: |
          Set-Culture fa-IR
          Set-TimeZone -Id "Iran Standard Time"

      - name: Check settings in a new process
        shell: pwsh
        run: |
          pwsh -NoProfile -Command "[cultureinfo]::CurrentCulture.Name; [TimeZoneInfo]::Local.Id; (Get-Date).ToString()"

      - name: Install SQL Server LocalDB
        uses: potatoqualitee/mssqlsuite@v2
        with:
          install: localdb

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        id: test
        shell: bash
        run: |
          set +e
          dotnet test tests/Fratak-Shop.Tests/Fratak-Shop.Tests.csproj -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults > test.log 2>&1
          code=$?
          tail -n 40 test.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Test summary
        id: summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          total = passed = failed = skipped = 0
          for path in glob.glob("TestResults/*.trx"):
              c = ET.parse(path).getroot().find("t:ResultSummary/t:Counters", ns)
              if c is not None:
                  total += int(c.get("total", 0)); passed += int(c.get("passed", 0))
                  failed += int(c.get("failed", 0)); skipped += int(c.get("notExecuted", 0))
          print(f"::notice title=Windows tests::{passed} of {total} passed, {failed} failed, {skipped} skipped")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skipped={skipped}\n")
          PY

      - name: Report test results
        if: always() && (steps.test.outputs.code != '0' || steps.summary.outputs.skipped != '0')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Windows (fa-IR, LocalDB)"
            python .github/scripts/trx-failures.py TestResults/*.trx 2>/dev/null || echo "### Tests failed (no trx)"
            echo "#### Skipped / log tail"
            echo '```'; grep -E "Skipped|error|Error|Failed|failed" test.log | tail -n 40 | head -c 15000; echo '```'
          } > body.md
          cat body.md
          if [ "${{ github.event_name }}" = "push" ]; then gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null; fi
          exit 1
